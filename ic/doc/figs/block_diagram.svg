<text x="650" y="214" font-size="14" text-anchor="middle" font-weight="700" fill="#e67700">Tiền xử lý (bước LOAD)</text>
<text x="556" y="244" font-size="13" text-anchor="start" font-weight="400" fill="#1f2328">A_raw = A + e</text>
<text x="556" y="270" font-size="13" text-anchor="start" font-weight="400" fill="#1f2328">ΔE = (e − e_prev) · 2^FD</text>
<text x="556" y="296" font-size="13" text-anchor="start" font-weight="400" fill="#1f2328">diff = ΔE − Df</text>
<text x="650" y="344" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a" font-style="italic">3 bộ cộng/trừ, không nhân</text>
