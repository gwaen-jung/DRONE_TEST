<text x="248" y="546" font-size="13" text-anchor="start" font-weight="400" fill="#1f2328">e_prev[3]   sai số lần trước</text>
<text x="248" y="568" font-size="13" text-anchor="start" font-weight="400" fill="#1f2328">Df[3]   đạo hàm đã lọc</text>
<text x="248" y="590" font-size="13" text-anchor="start" font-weight="400" fill="#1f2328">mix[3]   đầu ra PID</text>
