<circle cx="1120" cy="864" r="20" fill="#fff4e6" stroke="#d9480f" stroke-width="2.5"/>
<text x="1092" y="869" font-size="13" text-anchor="end" font-weight="700" fill="#d9480f">M4 · GPIO12</text>
<rect x="1172" y="790" width="36" height="28" rx="5" fill="#1b1f24"/>
<text x="40" y="734" font-size="14" text-anchor="start" font-weight="400" fill="#1f2328">• ESP32 ↔ STM32: TX nối RX, RX nối TX (bắt chéo). Cả hai đều 3.3V, nối thẳng không cần chuyển mức.</text>
<text x="40" y="756" font-size="14" text-anchor="start" font-weight="400" fill="#1f2328">• GPIO12 (M4) là chân strapping: ESC kéo tín hiệu lên HIGH lúc cấp nguồn thì ESP32 không khởi động được.</text>
<text x="40" y="778" font-size="14" text-anchor="start" font-weight="400" fill="#1f2328">• Drone nhận ESP-NOW trên kênh WiFi 1 và tự học MAC của tay cầm từ gói đầu tiên.</text>
<text x="40" y="800" font-size="14" text-anchor="start" font-weight="400" fill="#1f2328">• Tay cầm cần MAC STA của ESP32 drone này, điền vào src/DroneMac.h.</text>
<text x="40" y="822" font-size="14" text-anchor="start" font-weight="400" fill="#1f2328">• NRF24 trên STM32 là kênh RF dự phòng; STM32 nạp bằng ST-Link qua header SWD, không qua USB.</text>
</svg>