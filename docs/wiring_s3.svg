<text x="60" y="920" font-size="14" fill="#1f2328">• Nguồn: joystick, MTS102, OLED, NRF24, TFT lấy 3V3 của board · loa lấy 5V riêng · TẤT CẢ GND nối chung.</text>
<text x="60" y="942" font-size="14" fill="#1f2328">• TFT và NRF24 dùng 2 bus SPI RIÊNG (không nối chung dây SCK/MOSI/MISO).</text>
<text x="60" y="964" font-size="14" fill="#1f2328">• Tránh: GPIO0/3/45/46 (strapping), 19/20 (USB), 35–37 (PSRAM), 43/44, 48 (LED).</text>
