;========================================================================================================== 
;                      default environment for PlatformIO project
;========================================================================================================= 
[platformio]
default_envs = esp32_drone

;=====================================================================================================
;                                 platform for esp32 for Drone
;=====================================================================================================
[env:esp32_drone]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
    sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.0
    https://github.com/derdoktor667/DShotRMT.git#oldAPI
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit SSD1306@^2.5.15
extra_scripts =
    pre:dshot_patch.py
build_src_filter =
    +<*>
    +<main_esp32.cpp>
    -<main_esp32_dev.cpp>
    -<main_stm32f103c8t6.cpp>
    -<main_stm32f103c8t6_new.cpp>
    -<main_esp32_controler.cpp>
    -<main_esp32_n16r8_test.cpp>
    -<Main_audio_test.cpp>
    -<hello_gmt147.cpp>
    -<Web/>
    -<Flight/>
    -<Flight.cpp>
    -<Flight.h>
    -<RF_RX/>
    -<RF_TX/>
    -<display/>
    -<Audio/>
    -<VoiceData.cpp>
    -<VoiceData.h>
;=====================================================================================================
;                                 platform for STM32F103C8 for Drone
;=====================================================================================================
[env:stm32_drone]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
; TX buffer 256B de printf log khong bi chan (busy-wait) lam UART_task doc tre,
; RX buffer 64B chi chua ~5.5ms du lieu o 115200 baud.
build_flags = -DSERIAL_TX_BUFFER_SIZE=256
lib_deps =
    nrf24/RF24@^1.4.8
    stm32duino/STM32duino FreeRTOS@^10.3.2
build_src_filter =
    +<*>
    +<main_stm32f103c8t6.cpp>
    -<main_esp32.cpp>
    -<main_esp32_controler.cpp>
    -<main_esp32_dev.cpp>
    -<main_esp32_n16r8_test.cpp>
    -<Main_audio_test.cpp>
    +<Flight/>
    -<IMU/>
    -<Web/>
    -<Task/>
    -<RF_TX/>
    -<display/>
    -<GPS/>
    -<Audio/>
    -<Logo/>
    -<VoiceData.cpp>
    -<VoiceData.h>
;=====================================================================================================
;                                 platform for esp32 for controller
;=====================================================================================================
[env:esp32_controller]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    nrf24/RF24@^1.4.8
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit SSD1306@^2.5.15
    adafruit/Adafruit GFX Library@^1.12.1
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=27
    -D TFT_DC=26
    -D TFT_RST=14
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
build_src_filter =
    +<*>
    +<main_esp32_controler.cpp>
    -<Main_audio_test.cpp>
    -<main_esp32_dev.cpp>
    -<Web/>
    -<main_esp32.cpp>
    -<main_stm32f103c8t6.cpp>
    -<main_esp32_n16r8_test.cpp>
    -<RF_RX/>
    -<IMU/>
    -<BNO/>
    -<Flight/>
    -<Flight.cpp>
    -<Flight.h>
    -<Motor/>
    -<GPS/>
board_build.embed_files =
    src/voice_data/armed.pcm
    src/voice_data/disarmed.pcm
    src/voice_data/battery_low.pcm
    src/voice_data/rth_activated.pcm
    src/voice_data/angle_mode.pcm
    src/voice_data/beeper_activated.pcm
    src/voice_data/throttle_warning.pcm
    src/voice_data/flight_controller_ready.pcm
    src/voice_data/telemetry_recovered.pcm
    src/voice_data/telemetry_lost.pcm

;===========================================================================================
;                 esp32s3_controller - ban CHUA CHAY tren WeAct ESP32-S3 N16R8
;===========================================================================================
; Cung code voi esp32_controller, chi khac board + so do chan. Nap: pio run -e esp32s3_controller -t upload
; Serial/nap qua cong USB native (GPIO19/20) nen khong phu thuoc chip USB-UART.
;
;   Chuc nang            DevKit V1 (cu)     WeAct S3 (moi)
;   -------------------------------------------------------
;   J1 VRx throttle      GPIO34             GPIO1   (ADC1)
;   J1 VRy yaw           GPIO35             GPIO2   (ADC1)
;   J2 VRx roll          GPIO32             GPIO4   (ADC1)
;   J2 VRy pitch         GPIO33             GPIO5   (ADC1)
;   MTS102 menu switch   GPIO36             GPIO6
;   J1 SW (doi mode)     GPIO25             GPIO7
;   J2 SW (nav mode)     GPIO13             GPIO21
;   NRF24 SCK/MOSI/MISO  18/23/19           12/11/13 (SPI mac dinh S3)
;   NRF24 CSN / CE       5 / 4              10 / 14
;   TFT SCLK/MOSI/MISO   18/23/19 (chung)   40/41/42 (bus HSPI rieng)
;   TFT CS / DC / RST    27 / 26 / 14       39 / 38 / 47
;   OLED SDA / SCL       21 / 22            8 / 9
;   I2S BCK/WS/DIN/SD    16/17/15/2         15/16/17/18
;   LED RGB (nav mode)   -                  48 (WS2812 tren board)
;
; Tranh: GPIO0/3/45/46 (strapping), 19/20 (USB), 35-37 (PSRAM OPI), 43/44 (UART0), 48 (LED RGB).
; TFT dung HSPI rieng (USE_HSPI_PORT) vi TFT_eSPI tren S3 hay treo khi dung chung FSPI voi RF24.
[env:esp32s3_controller]
extends = env:esp32_controller
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_filters = esp32_exception_decoder
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D JOY_THROTTLE_PIN=1
    -D JOY_YAW_PIN=2
    -D JOY_ROLL_PIN=4
    -D JOY_PITCH_PIN=5
    -D MTS102_SW_PIN=6
    -D CTRL_MODE_PIN=7
    -D NAV_MODE_PIN=21
    -D RF_CSN_PIN=10
    -D RF_CE_PIN=14
    -D OLED_SDA_PIN=8
    -D OLED_SCL_PIN=9
    -D AUDIO_PIN_BCK=15
    -D AUDIO_PIN_WS=16
    -D AUDIO_PIN_DIN=17
    -D AUDIO_PIN_SD=18
    -D STATUS_LED_PIN=48
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_SCLK=40
    -D TFT_MOSI=41
    -D TFT_MISO=42
    -D TFT_CS=39
    -D TFT_DC=38
    -D TFT_RST=47
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

;===========================================================================================
;                 esp32_n16r8_s3_weact test
;===========================================================================================
[env:esp32-s3-weact]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<main_esp32_n18r6_test.cpp>
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM

lib_deps = adafruit/Adafruit NeoPixel@^1.12.0

;===========================================================================================
;                 esp32_test test
;===========================================================================================

[env:esp32_s3_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder
build_src_filter =
    +<bai_tap_ve_nha.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit SSD1306@^2.5.15
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

;===========================================================================================
;   esp32s3_gmt147 — ESP32-S3 + GMT147SPI (ST7789V3, 172x320 IPS)
;   Nap: pio run -e esp32s3_gmt147 -t upload
;===========================================================================================
[env:esp32s3_gmt147]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI: GMT147SPI (ST7789V3, 172x320 IPS) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=172
    -DTFT_HEIGHT=320
    ; GPIO 40/41/42 can SPI3 (HSPI) tren S3 — khop voi esp32s3_controller
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=-1
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=39
    -DTFT_DC=38
    -DTFT_RST=47
    ; BL noi 3.3V truc tiep, khong can TFT_BL software control
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_src_filter =
    +<hello_gmt147.cpp>
    +<Logo/Logo.cpp>
