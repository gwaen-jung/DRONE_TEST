;========================================================================================================== 
;                      default environment for PlatformIO project
;========================================================================================================= 
[platformio]
default_envs = esp32_drone

;=====================================================================================================
;                                 platform for esp32 for Drone
;=====================================================================================================
[env:esp32_drone]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
    sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.0
    https://github.com/derdoktor667/DShotRMT.git#oldAPI
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit SSD1306@^2.5.15
extra_scripts =
    pre:dshot_patch.py
build_src_filter =
    +<*>
    +<main_esp32.cpp>
    -<main_esp32_dev.cpp>
    -<main_stm32f103c8t6.cpp>
    -<main_stm32f103c8t6_new.cpp>
    -<main_esp32_controler.cpp>
    -<main_esp32_n16r8_test.cpp>
    -<Main_audio_test.cpp>
    -<Web/>
    -<Flight/>
    -<Flight.cpp>
    -<Flight.h>
    -<RF_RX/>
    -<RF_TX/>
    -<display/>
    -<Audio/>
    -<VoiceData.cpp>
    -<VoiceData.h>
;=====================================================================================================
;                                 platform for STM32F103C8 for Drone
;=====================================================================================================
[env:stm32_drone]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
; TX buffer 256B de printf log khong bi chan (busy-wait) lam UART_task doc tre,
; RX buffer 64B chi chua ~5.5ms du lieu o 115200 baud.
build_flags = -DSERIAL_TX_BUFFER_SIZE=256
lib_deps =
    nrf24/RF24@^1.4.8
    stm32duino/STM32duino FreeRTOS@^10.3.2
build_src_filter =
    +<*>
    +<main_stm32f103c8t6.cpp>
    -<main_esp32.cpp>
    -<main_esp32_controler.cpp>
    -<main_esp32_dev.cpp>
    -<main_esp32_n16r8_test.cpp>
    -<Main_audio_test.cpp>
    +<Flight/>
    -<IMU/>
    -<Web/>
    -<Task/>
    -<RF_TX/>
    -<display/>
    -<GPS/>
    -<Audio/>
    -<VoiceData.cpp>
    -<VoiceData.h>
;=====================================================================================================
;                                 platform for esp32 for controller
;=====================================================================================================
[env:esp32_controller]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    nrf24/RF24@^1.4.8
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit SSD1306@^2.5.15
    adafruit/Adafruit GFX Library@^1.12.1
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=27
    -D TFT_DC=26
    -D TFT_RST=14
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
build_src_filter =
    +<*>
    +<main_esp32_controler.cpp>
    -<Main_audio_test.cpp>
    -<main_esp32_dev.cpp>
    -<Web/>
    -<main_esp32.cpp>
    -<main_stm32f103c8t6.cpp>
    -<main_esp32_n16r8_test.cpp>
    -<RF_RX/>
    -<IMU/>
    -<BNO/>
    -<Flight/>
    -<Flight.cpp>
    -<Flight.h>
    -<Motor/>
    -<GPS/>
board_build.embed_files =
    src/voice_data/armed.pcm
    src/voice_data/disarmed.pcm
    src/voice_data/battery_low.pcm
    src/voice_data/rth_activated.pcm
    src/voice_data/angle_mode.pcm
    src/voice_data/beeper_activated.pcm
    src/voice_data/throttle_warning.pcm
    src/voice_data/flight_controller_ready.pcm
    src/voice_data/telemetry_recovered.pcm
    src/voice_data/telemetry_lost.pcm

;===========================================================================================
;                 esp32_n16r8_s3_weact test
;===========================================================================================
[env:esp32-s3-weact]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<main_esp32_n18r6_test.cpp>
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM

lib_deps = adafruit/Adafruit NeoPixel@^1.12.0

;===========================================================================================
;                 esp32_audio_test test
;===========================================================================================

; Them khoi nay vao platformio.ini (canh cac env khac). Env rieng, khong dung
; chung code voi esp32_controller nen sua/nap thu am thanh khong dung cham gi
; den logic RC.
;
; board_build.embed_files nhung 5 file .pcm thang vao firmware qua linker
; (khong can SPIFFS/LittleFS). Duong dan phai dung boi vi ten symbol trong
; VoiceData.h duoc sinh tu chinh duong dan nay.
[env:esp32_audio_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<main_audio_test.cpp>
    +<Audio/>
    +<VoiceData.cpp>
board_build.embed_files =
    src/voice_data/armed.pcm
    src/voice_data/disarmed.pcm
    src/voice_data/battery_low.pcm
    src/voice_data/rth_activated.pcm
    src/voice_data/angle_mode.pcm
    src/voice_data/beeper_activated.pcm
    src/voice_data/throttle_warning.pcm
    src/voice_data/flight_controller_ready.pcm
    src/voice_data/telemetry_recovered.pcm
    src/voice_data/telemetry_lost.pcm